<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corriente nominal y selección de conductores</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14213d;--mut:#5b6b85;--pri:#1f4e8c;--acc:#f2b705;--ok:#1a7f45;--okb:#e3f5ea;--ko:#b3261e;--kob:#fdeceb;--bd:#d5deec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16233b;--tx:#e8eefb;--mut:#9fb0cc;--pri:#6ea4ee;--acc:#f2b705;--ok:#5fd18d;--okb:#12301f;--ko:#ff8a80;--kob:#3a1b19;--bd:#2a3b5c}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16233b;--tx:#e8eefb;--mut:#9fb0cc;--pri:#6ea4ee;--acc:#f2b705;--ok:#5fd18d;--okb:#12301f;--ko:#ff8a80;--kob:#3a1b19;--bd:#2a3b5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pri);color:#fff;padding:20px 16px;border-bottom:5px solid var(--acc)}
header h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
main{max-width:900px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
h2{margin:0 0 8px;font-size:1.15rem;color:var(--pri)}
details summary{cursor:pointer;font-weight:700}
.fx{background:var(--bg);border-left:4px solid var(--acc);padding:8px 12px;margin:8px 0;font-family:ui-monospace,Consolas,monospace;overflow-x:auto}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--bd);padding:5px 8px;text-align:center}th{background:var(--bg)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.act{border:2px solid var(--bd);border-radius:12px;padding:14px;background:var(--card);color:var(--tx);text-align:left;cursor:pointer;font:inherit}
.act:hover,.act.on{border-color:var(--pri)}.act b{display:block;color:var(--pri)}.act small{color:var(--mut)}
.badge{display:inline-block;margin-top:6px;font-size:.8rem;background:var(--acc);color:#14213d;border-radius:999px;padding:1px 10px;font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.q{font-size:1.05rem;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ko{border-color:var(--ko);background:var(--kob)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{padding:10px;border:2px solid var(--bd);border-radius:10px;font:inherit;width:140px;background:var(--card);color:var(--tx)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--acc);color:#14213d}
.fb{margin-top:12px;padding:12px;border-radius:10px}.fb.ok{background:var(--okb);border:1px solid var(--ok)}.fb.ko{background:var(--kob);border:1px solid var(--ko)}
.big{font-size:2.4rem;font-weight:800;color:var(--pri);margin:4px 0}
.mut{color:var(--mut);font-size:.9rem}
</style>
</head>
<body>
<header><h1>⚡ Corriente nominal y selección de conductores</h1><p>Repasa la teoría y practica con pruebas que cambian en cada intento.</p></header>
<main><nav id="nav"></nav><div id="app"></div></main>
<script>
var R=function(a,b){return Math.floor(Math.random()*(b-a+1))+a},P=function(a){return a[R(0,a.length-1)]},
SH=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(0,i),t=a[i];a[i]=a[j];a[j]=t}return a},
F=function(n,d){return n.toFixed(d==null?1:d).replace(".",",")};
var TAB=[[1.5,15.5],[2.5,21],[4,28],[6,36],[10,50],[16,68],[25,89],[35,110],[50,134]];
function mc(q,ok,bad,exp){var o=SH([ok].concat(bad));return{t:"mc",q:q,o:o,a:o.indexOf(ok),exp:exp}}
function num(q,a,u,exp){return{t:"num",q:q,a:a,u:u,exp:exp}}
var DEF=[["In","Corriente nominal (In)","Corriente de plena carga del equipo, tomada de la placa o calculada."],["Ib","Corriente de diseño (Ib)","Corriente con la que se dimensiona el circuito."],["Iz","Capacidad de conducción (Iz)","Máxima corriente que un conductor puede transportar sin calentarse más de lo permitido."],["S","Sección (S)","Área transversal del conductor en mm²; a mayor valor, mayor capacidad y menor caída de tensión."],["ΔV","Caída de tensión (ΔV)","Pérdida de voltaje a lo largo del conductor; depende de la corriente, la longitud y la sección."]];
var ST=[["Usa conductores de fase, neutro y tierra.",0],["Usa tres fases, (neutro) y tierra.",1],["Tensión usual en Bolivia: 220 V.",0],["Tensión usual en Bolivia: 380 V entre fases.",1],["Uso típico: iluminación, tomacorrientes y motores pequeños.",0],["Uso típico: motores y máquinas industriales.",1],["Para la misma potencia, la corriente por conductor es cerca de un tercio.",1],["Para la misma potencia, la corriente es mayor.",0],["Fórmula: I = P / (√3 · V · cos φ · η)",1],["Fórmula: I = P / (V · cos φ · η)",0],["El rendimiento η se escribe en decimal (88 % = 0,88).",2],["En cargas resistivas se usa cos φ = 1 y η = 1.",2],["La potencia en HP se multiplica por 746 para pasarla a W.",2]];
function pot(tri){var u=P(["W","kW","HP"]),w,s;
 if(u=="W"){w=P(tri?[3000,5000,7500,9000]:[800,1200,1500,2000]);s=w+" W"}
 else if(u=="kW"){var k=P(tri?[3,5.5,7.5,11,15,22]:[0.37,0.75,1.1,1.5,2.2]);w=k*1000;s=F(k,2)+" kW = "+Math.round(w)+" W"}
 else{var h=P(tri?[5,7.5,10,15,20,25]:[0.5,1,1.5,2,3]);w=h*746;s=F(h,1)+" HP = "+Math.round(w)+" W"}
 return{w:w,s:s}}
function elec(tri){var p=pot(tri),c=P([0.75,0.8,0.85,0.9]),e=P([0.8,0.85,0.88,0.9]),V=tri?380:220,I=p.w/((tri?1.732:1)*V*c*e);
 return num("Un motor "+(tri?"trifásico":"monofásico")+" de <b>"+p.s.split(" = ")[0]+"</b> trabaja a <b>"+V+" V</b> con cos φ = <b>"+F(c,2)+"</b> y η = <b>"+F(e,2)+"</b>. Calcula la corriente I.",I,"A","P = "+Math.round(p.w)+" W.<br>I = "+Math.round(p.w)+" / ("+(tri?"√3 · ":"")+V+" · "+F(c,2)+" · "+F(e,2)+") = <b>"+F(I,2)+" A</b>")}
var ACT={
a1:{t:"Identifica el concepto",d:"Une cada definición con su término.",g:function(){var d=P(DEF);return mc("¿A qué concepto corresponde esta definición?<br><i>«"+d[2]+"»</i>",d[1],DEF.filter(function(x){return x!=d}).map(function(x){return x[1]}),"Es la <b>"+d[1]+"</b>.")}},
a2:{t:"Corriente de diseño (Ib)",d:"Motor: 125 % de In. Alimentador: demanda máxima.",g:function(){if(R(1,10)<=7){var n=R(6,60);return num("La placa de un motor indica In = <b>"+n+" A</b>. ¿Cuál es la corriente de diseño Ib?",n*1.25,"A","Ib = 1,25 · In = 1,25 · "+n+" = <b>"+F(n*1.25,2)+" A</b>")}var D=R(30,120);return num("Un alimentador tiene una demanda máxima de <b>"+D+" A</b>. ¿Cuál es su corriente de diseño Ib?",D,"A","Para un alimentador, Ib = demanda máxima = <b>"+D+" A</b>")}},
a3:{t:"Circuitos monofásicos",d:"I = P / (V · cos φ · η) con 220 V.",g:function(){return elec(false)}},
a4:{t:"Circuitos trifásicos",d:"I = P / (√3 · V · cos φ · η) con 380 V.",g:function(){return elec(true)}},
a5:{t:"¿Mono, tri o ambos?",d:"Clasifica cada afirmación.",g:function(){var s=P(ST);return mc("¿A qué sistema corresponde esta afirmación?<br><i>«"+s[0]+"»</i>",["Monofásico","Trifásico","Ambos"][s[1]],["Monofásico","Trifásico","Ambos"].filter(function(x,i){return i!=s[1]}),"Respuesta: <b>"+["Monofásico","Trifásico","Ambos"][s[1]]+"</b>.")}},
a6:{t:"Cargas resistivas",d:"Hornos y resistencias: cos φ = 1 y η = 1.",g:function(){var k=P([2,3,4.5,6,9,12]),tri=R(0,1)==1,V=tri?380:220,I=k*1000/((tri?1.732:1)*V);return num("Un horno resistivo de <b>"+F(k,1)+" kW</b> se conecta a un sistema <b>"+(tri?"trifásico de 380 V":"monofásico de 220 V")+"</b>. Calcula la corriente I.",I,"A","Carga resistiva: cos φ = 1 y η = 1.<br>I = "+Math.round(k*1000)+" / ("+(tri?"√3 · ":"")+V+") = <b>"+F(I,2)+" A</b>")}},
a7:{t:"Sección y protección",d:"Elige la sección o la protección correcta.",g:function(){
 if(R(0,1)){var Ib=R(8,125),ok=TAB.filter(function(r){return r[0]>=2.5&&r[1]>=Ib})[0],bad=SH(TAB.filter(function(r){return r!=ok})).slice(0,3);
  return mc("Un circuito de fuerza (cobre, PVC, en tubería) tiene Ib = <b>"+Ib+" A</b>. ¿Cuál es la sección mínima que cumple Ib ≤ Iz? Usa la tabla de abajo.",ok[0]+" mm²",bad.map(function(r){return r[0]+" mm²"}),"Se busca el primer Iz ≥ "+Ib+" A (con mínimo de 2,5 mm² en fuerza): <b>"+ok[0]+" mm²</b> (Iz = "+ok[1]+" A).")}
 var b=R(16,60),z=b+R(8,20),c=Math.round((b+z)/2);
 return mc("Un circuito tiene Ib = <b>"+b+" A</b> y el conductor tiene Iz = <b>"+z+" A</b>. ¿Qué corriente nominal de protección cumple Ib ≤ In protección ≤ Iz?",c+" A",[b-R(3,6)+" A",z+R(3,8)+" A",z+R(10,16)+" A"],"Debe cumplirse "+b+" ≤ In ≤ "+z+". Cumple: <b>"+c+" A</b>. Menor que Ib dispara sin motivo; mayor que Iz no protege el conductor.")}},
a8:{t:"Alimentador de varios motores",d:"1,25 × In del mayor + suma de las demás cargas.",g:function(){var m=[R(5,40),R(5,40),R(5,40)],o=R(0,1)?R(4,12):0,mx=Math.max.apply(null,m),s=m.reduce(function(a,b){return a+b},0)-mx+o,I=1.25*mx+s;
 return num("Un alimentador lleva tres motores con In = <b>"+m.join(" A, ")+" A</b>"+(o?" y otra carga de <b>"+o+" A</b>":"")+". Calcula la corriente de diseño del alimentador.",I,"A","Mayor: "+mx+" A → 1,25 · "+mx+" = "+F(1.25*mx,2)+" A.<br>Suma del resto: "+F(s,1)+" A.<br>Ib = <b>"+F(I,2)+" A</b>")}}
};
var SEC=[
{t:"3.1 Conceptos",h:"3.1 Conceptos fundamentales",th:"<ul><li><b>In</b>: corriente de plena carga (placa o cálculo).</li><li><b>Ib</b>: corriente de diseño. Motor: 125 % de In; alimentador: demanda máxima.</li><li><b>Iz</b>: capacidad de conducción del conductor.</li><li><b>S</b>: sección en mm²; más sección = más capacidad y menos caída de tensión.</li><li><b>ΔV</b>: pérdida de voltaje según corriente, longitud y sección.</li></ul>",a:["a1","a2"]},
{t:"3.2 Fórmulas",h:"3.2 Fórmulas de corriente nominal",th:"<div class='fx'>Monofásico: I = P / (V · cos φ · η)</div><div class='fx'>Trifásico: I = P / (√3 · V · cos φ · η)</div><p>P en W (kW × 1000; HP × 746). V = 220 V (fase-neutro) o 380 V (entre fases). √3 = 1,732. η en decimal (88 % = 0,88). En cargas resistivas, cos φ = 1 y η = 1.</p>",a:["a3","a4"]},
{t:"3.3 Mono vs tri",h:"3.3 Monofásico y trifásico",th:"<div class='sc'><table><tr><th></th><th>Monofásico</th><th>Trifásico</th></tr><tr><td>Conductores</td><td>Fase, neutro, tierra</td><td>3 fases, (neutro), tierra</td></tr><tr><td>Tensión en Bolivia</td><td>220 V</td><td>380 V</td></tr><tr><td>Uso típico</td><td>Iluminación, tomacorrientes, motores pequeños</td><td>Motores y máquinas industriales</td></tr><tr><td>Corriente (misma P)</td><td>Mayor</td><td>≈ un tercio por conductor</td></tr></table></div>",a:["a5","a6"]},
{t:"3.5 Conductores",h:"3.5 Selección de conductores y alimentadores",th:"<ul><li><b>Conducción</b>: Ib ≤ Iz.</li><li><b>Caída de tensión</b> dentro de límites.</li><li><b>Protección</b>: Ib ≤ In protección ≤ Iz.</li><li><b>Sección mínima</b>: 2,5 mm² en fuerza, 1,5 mm² en mando.</li><li><b>Instalación</b>: temperatura, agrupamiento y canalización reducen la capacidad.</li></ul><p>Motor individual: 1,25 × In. Alimentador: 1,25 × In del motor mayor + suma de las demás In y cargas.</p><div class='sc'><table><tr><th>S (mm²)</th><th>1,5</th><th>2,5</th><th>4</th><th>6</th><th>10</th><th>16</th><th>25</th><th>35</th><th>50</th></tr><tr><td>Iz (A)</td><td>15,5</td><td>21</td><td>28</td><td>36</td><td>50</td><td>68</td><td>89</td><td>110</td><td>134</td></tr></table></div><p class='mut'>Valores referenciales (cobre, PVC, en tubería, 3 conductores cargados, 30 °C). En un proyecto real consulta la tabla del fabricante y la norma vigente.</p>",a:["a7","a8"]}];
var best={},S={sec:0,act:null,qs:[],i:0,sc:0,ans:false,last:null};
try{best=JSON.parse(localStorage.getItem("ci-best")||"{}")}catch(e){}
var nav=document.getElementById("nav"),app=document.getElementById("app");
function lvl(p){return p>=90?"Excelente":p>=75?"Muy bueno":p>=51?"Debes repasar":"Necesitas reforzar"}
function draw(){
 nav.innerHTML=SEC.map(function(s,i){return "<button class='"+(i==S.sec?"on":"")+"' data-s='"+i+"'>"+s.t+"</button>"}).join("");
 var s=SEC[S.sec],h="";
 if(S.act==null){
  h+="<div class='card'><h2>"+s.h+"</h2><details open><summary>Repaso rápido</summary>"+s.th+"</details></div><div class='card'><h2>Actividades</h2><div class='acts'>"+s.a.map(function(k){var b=best[k];return "<button class='act' data-a='"+k+"'><b>"+ACT[k].t+"</b><small>"+ACT[k].d+"</small>"+(b!=null?"<br><span class='badge'>Mejor: "+b+" %</span>":"")+"</button>"}).join("")+"</div></div>";
 }else if(S.i>=5){
  var p=S.sc*20;h+="<div class='card' style='text-align:center'><h2>"+ACT[S.act].t+"</h2><div class='big'>"+S.sc+" / 5</div><p><b>"+p+" %</b> — "+lvl(p)+"</p><div class='row' style='justify-content:center'><button class='btn' data-r='1'>Nueva prueba</button><button class='btn alt' data-b='1'>Volver</button></div><p class='mut'>Las preguntas y los datos cambian en cada intento.</p></div>";
 }else{
  var q=S.qs[S.i];
  h+="<div class='card'><div class='row' style='justify-content:space-between'><h2>"+ACT[S.act].t+"</h2><span class='mut'>Pregunta "+(S.i+1)+" de 5 · Aciertos: "+S.sc+"</span></div><div class='bar'><i style='width:"+(S.i*20)+"%'></i></div><div class='q'>"+q.q+"</div>";
  if(q.t=="mc"){h+=q.o.map(function(o,i){var c="";if(S.ans){if(i==q.a)c=" ok";else if(i==S.last)c=" ko"}return "<button class='opt"+c+"' data-o='"+i+"'"+(S.ans?" disabled":"")+">"+o+"</button>"}).join("")}
  else{h+="<div class='row'><input type='text' id='in' inputmode='decimal' placeholder='Respuesta' autocomplete='off'"+(S.ans?" disabled value='"+S.last+"'":"")+"> <b>"+q.u+"</b>"+(S.ans?"":"<button class='btn' data-c='1'>Comprobar</button>")+"</div><p class='mut'>Tolerancia ±2 %. Puedes usar coma o punto.</p>"}
  if(S.ans)h+="<div class='fb "+(S.good?"ok":"ko")+"'><b>"+(S.good?"¡Correcto!":"Incorrecto.")+"</b><br>"+q.exp+"</div><p><button class='btn' data-n='1'>"+(S.i==4?"Ver resultado":"Siguiente")+"</button></p>";
  h+="</div>";
  if(S.act=="a7")h+="<div class='card'><details><summary>Tabla de Iz referencial</summary><div class='sc'><table><tr><th>S (mm²)</th>"+TAB.map(function(r){return "<td>"+r[0]+"</td>"}).join("")+"</tr><tr><th>Iz (A)</th>"+TAB.map(function(r){return "<td>"+r[1]+"</td>"}).join("")+"</tr></table></div></details></div>";
  h+="<p><button class='btn alt' data-b='1'>Salir de la actividad</button></p>";
 }
 app.innerHTML=h;var inp=document.getElementById("in");if(inp&&!S.ans)inp.focus();
}
function start(k){S.act=k;S.qs=[];for(var i=0;i<5;i++)S.qs.push(ACT[k].g());S.i=0;S.sc=0;S.ans=false;draw()}
function done(g){S.ans=true;S.good=g;if(g)S.sc++;draw()}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;var d=t.dataset;
 if(d.s!=null){S.sec=+d.s;S.act=null;draw()}
 else if(d.a){start(d.a)}
 else if(d.r){start(S.act)}
 else if(d.b){S.act=null;draw()}
 else if(d.o!=null&&!S.ans){S.last=+d.o;done(+d.o==S.qs[S.i].a)}
 else if(d.c&&!S.ans){var v=parseFloat(document.getElementById("in").value.replace(",","."));if(isNaN(v))return;var a=S.qs[S.i].a;S.last=document.getElementById("in").value;done(Math.abs(v-a)<=Math.max(0.02*a,0.1))}
 else if(d.n){S.i++;S.ans=false;if(S.i>=5){var p=S.sc*20;if(best[S.act]==null||p>best[S.act]){best[S.act]=p;try{localStorage.setItem("ci-best",JSON.stringify(best))}catch(x){}}}draw()}
});
document.addEventListener("keydown",function(e){if(e.key=="Enter"){var b=document.querySelector("[data-c]");if(b)b.click();else{b=document.querySelector("[data-n]");if(b)b.click()}}});
draw();
</script>
</body>
</html>
